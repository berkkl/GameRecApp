name: Public repository privacy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_files.py
      - name: Install scanner hooks
        run: python -m pip install pre-commit==4.3.0
      - name: Scan tracked files for secrets
        run: pre-commit run --all-files
      - name: Scan commit history for secrets
        run: |
          scanner=$(find "$HOME/.cache/pre-commit" -type f -name gitleaks -perm -111 -print -quit)
          test -n "$scanner"
          "$scanner" git . --redact --log-opts="--all"
