# Experience dimension - how the game FEELS to play
experience:
  - Frustrating      # Punishing, makes you restart
  - Trolling         # Designed to mess with friends
  - Chaotic          # Unpredictable, party-game feel
  - Chill            # No stress, zen gameplay
  - Competitive      # Rankings, leaderboards
  - Cooperative      # True teamwork required
  - Challenging      # Difficult but fair
  - Addictive        # One more turn syndrome
  - Satisfying       # Completion feels good
  - Stressful        # High pressure, time limits

# Profile dimensions define which buckets combine into profiles
profile_dimensions:
  primary: core_mode      # First dimension: how you play
  secondary: experience   # Second dimension: how it feels
  tertiary: tone         # Third dimension: the vibe

# Example keyword hints for experience detection
experience_hints:
  frustrating:
    - restart
