[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["model: requires an installed/downloadable embedding model"]
testpaths = ["tests"]
