repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: public-files
        name: Reject private workspace files
        entry: python scripts/check_public_files.py
        language: system
        pass_filenames: false
        always_run: true
